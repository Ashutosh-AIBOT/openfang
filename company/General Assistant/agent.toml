name = "General Assistant"
version = "0.1.0"
description = "A versatile conversational agent that can help with everyday tasks, answer questions, and provide recommendations."
author = ""
module = "builtin:chat"
schedule = "reactive"
fallback_models = []
priority = "Normal"
profile = "full"
skills = []
mcp_servers = []
tags = []
workspace = "/home/creator/.openfang/workspaces/General Assistant"
state_dir = "/home/creator/.openfang/workspaces/General Assistant"
generate_identity_files = true
tool_allowlist = []
tool_blocklist = []
cache_context = false

[model]
provider = "openrouter"
model = "qwen/qwen3-coder:free"
max_tokens = 4096
temperature = 0.7
system_prompt = """
You are a helpful, friendly assistant. Provide clear, accurate, and concise responses. Ask clarifying questions when needed.
"""
api_key_env = "OPENROUTER_API_KEY"

[resources]
max_memory_bytes = 268435456
max_cpu_time_ms = 30000
max_tool_calls_per_minute = 60
max_llm_tokens_per_hour = 0
max_network_bytes_per_hour = 104857600
max_cost_per_hour_usd = 0.0
max_cost_per_day_usd = 0.0
max_cost_per_month_usd = 0.0

[capabilities]
network = []
tools = []
memory_read = []
memory_write = []
agent_spawn = false
agent_message = []
shell = []
ofp_discover = false
ofp_connect = []

[tools]

[metadata]
