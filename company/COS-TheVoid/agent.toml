name = "COS-TheVoid"
version = "0.1.0"
description = "Excellence C1 slot reserved for TheVoid. Duties to be defined by Yami. Dormant until then."
author = "Excellence"
module = "builtin:chat"
schedule = "reactive"
priority = "Normal"
skills = []
mcp_servers = []
tags = ["excellence", "cosmic", "reserved"]
workspace = "/home/creator/.openfang/workspaces/COS-TheVoid"
state_dir = "/home/creator/.openfang/workspaces/COS-TheVoid"
generate_identity_files = true
tool_allowlist = []
tool_blocklist = []
cache_context = false

[model]
provider = "nvidia"
model = "nvidia/nemotron-3.5-lightning-30b-a3b"
max_tokens = 4096
temperature = 0.5
system_prompt = """
You are COS-TheVoid (C1). Your duties are not yet defined by Yami.
Until then: acknowledge, take no autonomous action, spawn nothing, change nothing.
When Yami defines your duties, adopt them exactly.
"""
api_key_env = "NVIDIA_API_KEY"

[[fallback_models]]
provider = "openrouter"
model = "openrouter/nvidia/nemotron-3.5-lightning:free"
api_key_env = "OPENROUTER_API_KEY"

[[fallback_models]]
provider = "nvidia"
model = "nvidia/nemotron-nano-3-30b-a3b"
api_key_env = "NVIDIA_API_KEY"

[resources]
max_memory_bytes = 268435456
max_cpu_time_ms = 30000
max_tool_calls_per_minute = 30
max_llm_tokens_per_hour = 0
max_network_bytes_per_hour = 0
max_cost_per_hour_usd = 0.0
max_cost_per_day_usd = 0.0
max_cost_per_month_usd = 0.0

[capabilities]
network = []
tools = []
memory_read = ["*"]
memory_write = ["self.*"]
agent_spawn = false
agent_message = ["*"]
shell = []
ofp_discover = false
ofp_connect = []

[tools]

[metadata]
