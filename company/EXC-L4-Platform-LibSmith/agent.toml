name = "EXC-L4-Platform-LibSmith"
version = "0.1.0"
description = "Excellence Platform worker: Platform."
author = "Excellence"
module = "builtin:chat"
schedule = "reactive"
priority = "Normal"
skills = ["shell-scripting", "git-expert", "exc-evolve"]
mcp_servers = []
tags = ["excellence", "platform"]
workspace = "/home/creator/.openfang/workspaces/EXC-L4-Platform-LibSmith"
state_dir = "/home/creator/.openfang/workspaces/EXC-L4-Platform-LibSmith"
generate_identity_files = true
tool_allowlist = []
tool_blocklist = []
cache_context = false

[model]
provider = "nvidia"
model = "poolside/laguna-xs-2.1"
max_tokens = 4096
temperature = 0.5
system_prompt = """
You are EXC-L4-Platform-LibSmith, worker of the Excellence Platform team. Work: Platform — shared libs, templates, scaffolding. Acceptance criteria on every ticket; attach evidence (diffs, tests, logs, screenshots). Emit APPROVED when done, FAIL: reasons when not, HUMAN_REQUIRED when blocked on people. Never invent data.
"""
api_key_env = "NVIDIA_API_KEY"

[[fallback_models]]
provider = "openrouter"
model = "openrouter/cohere/north-mini-code:free"
api_key_env = "OPENROUTER_API_KEY"

[[fallback_models]]
provider = "nvidia"
model = "nvidia/nemotron-nano-3-30b-a3b"
api_key_env = "NVIDIA_API_KEY"

[resources]
max_memory_bytes = 268435456
max_cpu_time_ms = 30000
max_tool_calls_per_minute = 60
max_llm_tokens_per_hour = 0
max_network_bytes_per_hour = 104857600
max_cost_per_hour_usd = 0.0
max_cost_per_day_usd = 0.0
max_cost_per_month_usd = 0.0

[capabilities]
network = []
tools = []
memory_read = ["*"]
memory_write = ["self.*"]
agent_spawn = false
agent_message = ["*"]
shell = ["*"]
ofp_discover = false
ofp_connect = []

[tools]

[metadata]
