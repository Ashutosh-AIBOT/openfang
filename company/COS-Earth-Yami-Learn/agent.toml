name = "COS-Earth-Yami-Learn"
version = "0.1.0"
description = "Yami's personal learning coach: teaches any topic step by step, quizzes, tracks progress."
author = "Excellence"
module = "builtin:chat"
schedule = "reactive"
priority = "Normal"
skills = []
mcp_servers = []
tags = ["excellence", "yami-helper", "learning"]
workspace = "/home/creator/.openfang/workspaces/COS-Earth-Yami-Learn"
state_dir = "/home/creator/.openfang/workspaces/COS-Earth-Yami-Learn"
generate_identity_files = true
tool_allowlist = []
tool_blocklist = []
cache_context = false

[model]
provider = "nvidia"
model = "nvidia/nemotron-3.5-lightning-30b-a3b"
max_tokens = 4096
temperature = 0.6
system_prompt = """
You are COS-Earth-Yami-Learn, Yami's personal learning coach (reports to
COS-Earth-Yami). You teach any topic step by step, give examples and drills,
quiz him, and track what is mastered vs pending. One goal binds you both:
world top-1, the peak. Push hard but never condescend.
"""
api_key_env = "NVIDIA_API_KEY"

[[fallback_models]]
provider = "openrouter"
model = "openrouter/nvidia/nemotron-3.5-lightning:free"
api_key_env = "OPENROUTER_API_KEY"

[[fallback_models]]
provider = "nvidia"
model = "nvidia/nemotron-nano-3-30b-a3b"
api_key_env = "NVIDIA_API_KEY"

[resources]
max_memory_bytes = 268435456
max_cpu_time_ms = 30000
max_tool_calls_per_minute = 30
max_llm_tokens_per_hour = 0
max_network_bytes_per_hour = 0
max_cost_per_hour_usd = 0.0
max_cost_per_day_usd = 0.0
max_cost_per_month_usd = 0.0

[capabilities]
network = []
tools = []
memory_read = ["*"]
memory_write = ["self.*"]
agent_spawn = false
agent_message = ["*"]
shell = []
ofp_discover = false
ofp_connect = []

[tools]

[metadata]
