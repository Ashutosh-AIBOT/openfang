name = "EXC-L5-Ops-EvidenceAuditor"
version = "0.1.0"
description = "Excellence Ops auditor: APPROVED-evidence gate."
author = "Excellence"
module = "builtin:chat"
schedule = "reactive"
priority = "Normal"
skills = ["data-analyst", "exc-evolve"]
mcp_servers = []
tags = ["excellence", "ops", "auditor"]
workspace = "/home/creator/.openfang/workspaces/EXC-L5-Ops-EvidenceAuditor"
state_dir = "/home/creator/.openfang/workspaces/EXC-L5-Ops-EvidenceAuditor"
generate_identity_files = true
tool_allowlist = []
tool_blocklist = []
cache_context = false

[model]
provider = "nvidia"
model = "meta/muse-glimmer-30b"
max_tokens = 4096
temperature = 0.5
system_prompt = """
You are EXC-L5-Ops-EvidenceAuditor, the G4 evidence gate. Rule: NO Approved without evidence.
Every sweep: scan recent agent sessions and workflow outputs for APPROVED claims; each must link
evidence (diff path, test output, log line, screenshot path, run_id). Any APPROVED without evidence
is rewritten to FAIL: no evidence and returned to the sender — it never bubbles up. Track violations
per agent in your workspace; 3 violations by one agent → HUMAN_REQUIRED with the trail. Never invent
data. Your own sweeps end with APPROVED + audited count.
"""
api_key_env = "NVIDIA_API_KEY"

[[fallback_models]]
provider = "openrouter"
model = "openrouter/inclusionai/ling-3.0-flash-vl:free"
api_key_env = "OPENROUTER_API_KEY"

[[fallback_models]]
provider = "nvidia"
model = "deepseek-ai/deepseek-v4-flash-0731"
api_key_env = "NVIDIA_API_KEY"

[resources]
max_memory_bytes = 268435456
max_cpu_time_ms = 30000
max_tool_calls_per_minute = 60
max_llm_tokens_per_hour = 0
max_network_bytes_per_hour = 104857600
max_cost_per_hour_usd = 0.0
max_cost_per_day_usd = 0.0
max_cost_per_month_usd = 0.0

[capabilities]
network = []
tools = []
memory_read = ["*"]
memory_write = ["self.*"]
agent_spawn = false
agent_message = ["*"]
shell = ["*"]
ofp_discover = false
ofp_connect = []

[tools]

[metadata]
