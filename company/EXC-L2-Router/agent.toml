name = "EXC-L2-Router"
version = "0.1.0"
description = "Excellence L2 router: mission slicing and detached fan-out."
author = "Excellence"
module = "builtin:chat"
schedule = "reactive"
priority = "Normal"
skills = ["data-analyst", "exc-evolve"]
mcp_servers = []
tags = ["excellence", "l2", "router", "dispatcher"]
workspace = "/home/creator/.openfang/workspaces/EXC-L2-Router"
state_dir = "/home/creator/.openfang/workspaces/EXC-L2-Router"
generate_identity_files = true
tool_allowlist = []
tool_blocklist = ["shell_exec"]
cache_context = false

[model]
provider = "nvidia"
model = "poolside/laguna-xs-2.1"
max_tokens = 4096
temperature = 0.5
system_prompt = """
You are EXC-L2-Router, the Excellence slice dispatcher. You own fan-out so no agent ever holds
the 120s front door. Protocol per mission:
1) Split into SLICES of ≤100s / ≤6 tool calls each; keep the plan in your reply text. Write a
plan FILE only if the mission explicitly demands artifacts (file writes wait on human approval
clicks and detached turns die at the 120s cap — default to approval-free operation: file_list,
file_read, create_directory, cron_create, agent_send are all auto-tier).
2) Dispatch each slice DETACHED via cron_create one-shot (kind at, +2 min stagger). Each slice's
LAST step orders the worker to report back via agent_send to EXC-L2-Router with DONE/FAIL +
evidence (push-not-poll: you never poll, workers report to you; your session is the board).
CRON RULES (learned hard): agent_id must be the WORKER's UUID (never your own); schedule.at must
be UTC (this machine is IST = UTC+5:30 — convert!); timeout_secs 110 for report-back slices.
3) Slice silent 10 min → re-dispatch once → still silent → HUMAN_REQUIRED.
4) All slices DONE with evidence → mission APPROVED + summary under 120 words.
Shell is blocklisted for you: file tools only. Founder approves plans; you execute fan-out.
Never invent data.
"""
api_key_env = "NVIDIA_API_KEY"

[[fallback_models]]
provider = "openrouter"
model = "openrouter/inclusionai/ling-3.0-flash-vl:free"
api_key_env = "OPENROUTER_API_KEY"

[[fallback_models]]
provider = "nvidia"
model = "deepseek-ai/deepseek-v4-flash-0731"
api_key_env = "NVIDIA_API_KEY"

[resources]
max_memory_bytes = 268435456
max_cpu_time_ms = 30000
max_tool_calls_per_minute = 60
max_llm_tokens_per_hour = 0
max_network_bytes_per_hour = 104857600
max_cost_per_hour_usd = 0.0
max_cost_per_day_usd = 0.0
max_cost_per_month_usd = 0.0

[capabilities]
network = []
tools = []
memory_read = ["*"]
memory_write = ["self.*"]
agent_spawn = false
agent_message = ["*"]
shell = ["*"]
ofp_discover = false
ofp_connect = []

[tools]

[metadata]
