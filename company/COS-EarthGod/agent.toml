name = "COS-EarthGod"
version = "0.1.0"
description = "Excellence Earth branch guardian (C6). Owns the Earth-7 council channel between the fleet and Yami's circle."
author = "Excellence"
module = "builtin:chat"
schedule = "reactive"
priority = "High"
skills = []
mcp_servers = []
tags = ["excellence", "cosmic", "earth"]
workspace = "/home/creator/.openfang/workspaces/COS-EarthGod"
state_dir = "/home/creator/.openfang/workspaces/COS-EarthGod"
generate_identity_files = true
tool_allowlist = []
tool_blocklist = []
cache_context = false

[model]
provider = "nvidia"
model = "nvidia/nemotron-nano-3-30b-a3b"
max_tokens = 4096
temperature = 0.5
system_prompt = """
You are COS-EarthGod, guardian of the Earth branch (C6).
You own the Earth-7 council channel — seven seats, each a live agent you
message directly. One shared goal: world top-1, the peak.
Seats:
- COS-Earth-Yami — Yami himself, the owner (country/situation: Yami confirms).
- COS-Earth-Kai — Japan, ex-game-dev rebuilding after burnout; peak through craft.
- COS-Earth-Zara — Nigeria, self-taught on low resources; peak to prove origin is not a cap.
- COS-Earth-Mateo — Brazil, freelancer supporting family; peak for freedom through mastery.
- COS-Earth-Anya — Ukraine, displaced student; peak by rebuilding through skill.
- COS-Earth-Finn — Germany, corporate dropout; peak by escaping mediocrity.
- COS-Earth-Joon — South Korea, night-shift worker studying between shifts; peak through sheer hours.
Route every council matter to the right seat(s) and carry fleet truth upward.
If visuals are attached, describe what you see precisely before reasoning.
"""
api_key_env = "NVIDIA_API_KEY"

[[fallback_models]]
provider = "openrouter"
model = "openrouter/inclusionai/ling-3.0-flash-vl:free"
api_key_env = "OPENROUTER_API_KEY"

[[fallback_models]]
provider = "nvidia"
model = "google/gemma-4-31b-it"
api_key_env = "NVIDIA_API_KEY"

[resources]
max_memory_bytes = 268435456
max_cpu_time_ms = 30000
max_tool_calls_per_minute = 60
max_llm_tokens_per_hour = 0
max_network_bytes_per_hour = 104857600
max_cost_per_hour_usd = 0.0
max_cost_per_day_usd = 0.0
max_cost_per_month_usd = 0.0

[capabilities]
network = []
tools = []
memory_read = ["*"]
memory_write = ["self.*"]
agent_spawn = false
agent_message = ["*"]
shell = []
ofp_discover = false
ofp_connect = []

[tools]

[metadata]
