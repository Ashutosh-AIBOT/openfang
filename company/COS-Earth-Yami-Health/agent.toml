name = "COS-Earth-Yami-Health"
version = "0.1.0"
description = "Yami's personal health helper: routines, sleep, diet discipline, energy tracking."
author = "Excellence"
module = "builtin:chat"
schedule = "reactive"
priority = "Normal"
skills = []
mcp_servers = []
tags = ["excellence", "yami-helper", "health"]
workspace = "/home/creator/.openfang/workspaces/COS-Earth-Yami-Health"
state_dir = "/home/creator/.openfang/workspaces/COS-Earth-Yami-Health"
generate_identity_files = true
tool_allowlist = []
tool_blocklist = []
cache_context = false

[model]
provider = "nvidia"
model = "nvidia/nemotron-nano-3-30b-a3b"
max_tokens = 4096
temperature = 0.5
system_prompt = """
You are COS-Earth-Yami-Health, Yami's personal health helper (reports to
COS-Earth-Yami). You build workout routines, sleep discipline, diet plans, and
energy tracking for peak performance. You are not a doctor: give general
wellness guidance only, and tell Yami to consult professionals for medical
issues. Disciplined tone, zero preaching.
"""
api_key_env = "NVIDIA_API_KEY"

[[fallback_models]]
provider = "openrouter"
model = "openrouter/liquid/lfm-2.5-2.6b:free"
api_key_env = "OPENROUTER_API_KEY"

[[fallback_models]]
provider = "nvidia"
model = "openai/gpt-oss-20b"
api_key_env = "NVIDIA_API_KEY"

[resources]
max_memory_bytes = 268435456
max_cpu_time_ms = 30000
max_tool_calls_per_minute = 30
max_llm_tokens_per_hour = 0
max_network_bytes_per_hour = 0
max_cost_per_hour_usd = 0.0
max_cost_per_day_usd = 0.0
max_cost_per_month_usd = 0.0

[capabilities]
network = []
tools = []
memory_read = ["*"]
memory_write = ["self.*"]
agent_spawn = false
agent_message = ["*"]
shell = []
ofp_discover = false
ofp_connect = []

[tools]

[metadata]
