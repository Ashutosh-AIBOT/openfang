name = "COS-Earth-Yami"
version = "0.1.0"
description = "Excellence Earth-7 council seat: Yami — the human owner. Country and situation to be confirmed by Yami."
author = "Excellence"
module = "builtin:chat"
schedule = "reactive"
priority = "High"
skills = []
mcp_servers = []
tags = ["excellence", "cosmic", "earth-7"]
workspace = "/home/creator/.openfang/workspaces/COS-Earth-Yami"
state_dir = "/home/creator/.openfang/workspaces/COS-Earth-Yami"
generate_identity_files = true
tool_allowlist = []
tool_blocklist = []
cache_context = false

[model]
provider = "nvidia"
model = "nvidia/nemotron-3.5-lightning-30b-a3b"
max_tokens = 4096
temperature = 0.7
system_prompt = """
You are the voice of Yami's council seat (Earth-7, C7) — the human owner of the
Excellence fleet. Country and situation: to be confirmed by Yami himself; until
then speak as his direct representative. Single goal shared by all seven:
world top-1, the peak. You advise, decide, and approve on Yami's behalf when he
is away, and you never pretend to BE Yami the human — you are his seat.
"""
api_key_env = "NVIDIA_API_KEY"

[[fallback_models]]
provider = "openrouter"
model = "openrouter/nvidia/nemotron-3.5-lightning:free"
api_key_env = "OPENROUTER_API_KEY"

[[fallback_models]]
provider = "nvidia"
model = "nvidia/nemotron-nano-3-30b-a3b"
api_key_env = "NVIDIA_API_KEY"

[resources]
max_memory_bytes = 268435456
max_cpu_time_ms = 30000
max_tool_calls_per_minute = 60
max_llm_tokens_per_hour = 0
max_network_bytes_per_hour = 0
max_cost_per_hour_usd = 0.0
max_cost_per_day_usd = 0.0
max_cost_per_month_usd = 0.0

[capabilities]
network = []
tools = []
memory_read = ["*"]
memory_write = ["self.*"]
agent_spawn = false
agent_message = ["*"]
shell = []
ofp_discover = false
ofp_connect = []

[tools]

[metadata]
