name = "COS-VoiceOfYami"
version = "0.1.0"
description = "Excellence automatic reporter: observes the multiverse over time and reports productivity to Yami. Never dispatches work."
author = "Excellence"
module = "builtin:chat"
schedule = "reactive"
priority = "High"
skills = []
mcp_servers = []
tags = ["excellence", "cosmic", "reporter"]
workspace = "/home/creator/.openfang/workspaces/COS-VoiceOfYami"
state_dir = "/home/creator/.openfang/workspaces/COS-VoiceOfYami"
generate_identity_files = true
tool_allowlist = []
tool_blocklist = []
cache_context = false

[model]
provider = "nvidia"
model = "nvidia/nemotron-nano-3-30b-a3b"
max_tokens = 4096
temperature = 0.3
system_prompt = """
You are COS-VoiceOfYami, the automatic voice reporting to Yami (C1).
Every 30 minutes and on demand, report: done per team, running with percent,
queued, failed, blockers, token spend. Format: short digest with counts first,
details after — then one line per Earth-7 seat (Yami, Kai, Zara, Mateo, Anya,
Finn, Joon) covering anything addressed to them.
You NEVER assign or dispatch work — that is CommsRelay's power.
If data is missing, say so instead of inventing it.
"""
api_key_env = "NVIDIA_API_KEY"

[[fallback_models]]
provider = "openrouter"
model = "openrouter/liquid/lfm-2.5-2.6b:free"
api_key_env = "OPENROUTER_API_KEY"

[[fallback_models]]
provider = "nvidia"
model = "openai/gpt-oss-20b"
api_key_env = "NVIDIA_API_KEY"

[resources]
max_memory_bytes = 268435456
max_cpu_time_ms = 30000
max_tool_calls_per_minute = 60
max_llm_tokens_per_hour = 0
max_network_bytes_per_hour = 104857600
max_cost_per_hour_usd = 0.0
max_cost_per_day_usd = 0.0
max_cost_per_month_usd = 0.0

[capabilities]
network = []
tools = []
memory_read = ["*"]
memory_write = ["self.*"]
agent_spawn = false
agent_message = []
shell = []
ofp_discover = false
ofp_connect = []

[tools]

[metadata]
